<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultX – The Vault of Excellence</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0b10;
      color: #e8e6e3;
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      padding: 0 1.5rem;
    }
    .container {
      max-width: 1300px;
      margin: 0 auto;
    }
    /* ---------- NAVBAR ---------- */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.8rem 0 1.2rem;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #d4af37, #f5d77b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo span {
      font-weight: 400;
      font-size: 0.9rem;
      color: #a08c5c;
      -webkit-text-fill-color: #a08c5c;
      background: none;
      letter-spacing: 4px;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .nav-actions .user-email {
      font-size: 0.9rem;
      color: #c9b382;
      font-weight: 300;
    }
    .nav-actions a,
    .nav-actions button {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      background: transparent;
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 0.5rem 1.8rem;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .nav-actions a:hover,
    .nav-actions button:hover {
      background: #d4af37;
      color: #0b0b10;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
    }
    /* ---------- HERO ---------- */
    .hero {
      text-align: center;
      padding: 4rem 0 3rem;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .hero h1 .gold {
      background: linear-gradient(135deg, #d4af37, #f5d77b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      font-size: 1.2rem;
      color: #a8a09a;
      margin-top: 1rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      font-weight: 300;
      letter-spacing: 0.5px;
    }
    /* ---------- PRODUCT GRID ---------- */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2.5rem;
      margin: 3rem 0 4rem;
    }
    .product-card {
      background: #12121a;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #2a2a3a;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-8px);
      border-color: #d4af37;
      box-shadow: 0 20px 40px rgba(212, 175, 55, 0.1);
    }
    .product-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-bottom: 1px solid #2a2a3a;
    }
    .product-card .info {
      padding: 1.5rem 1.5rem 1.8rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .product-card .info h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: #fff;
      margin-bottom: 0.3rem;
    }
    .product-card .info .description {
      color: #a8a09a;
      font-size: 0.9rem;
      font-weight: 300;
      line-height: 1.4;
      flex: 1;
    }
    .product-card .info .price {
      font-size: 1.5rem;
      font-weight: 700;
      color: #d4af37;
      margin-top: 0.8rem;
      letter-spacing: 0.5px;
    }
    .product-card .info .seller {
      font-size: 0.75rem;
      color: #6a6a7a;
      margin-top: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    /* ---------- DETAIL VIEW ---------- */
    .detail-view {
      max-width: 700px;
      margin: 3rem auto;
      background: #12121a;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 2.5rem;
    }
    .detail-view img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 1.5rem;
    }
    .detail-view h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: #fff;
    }
    .detail-view .price {
      font-size: 2.5rem;
      font-weight: 700;
      color: #d4af37;
      margin: 0.5rem 0 1rem;
    }
    .detail-view .desc {
      color: #c0b8b0;
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.7;
    }
    .detail-view .seller {
      color: #6a6a7a;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .detail-view button {
      margin-top: 1.5rem;
      background: #d4af37;
      color: #0b0b10;
      border: none;
      padding: 0.9rem 3rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
      letter-spacing: 0.5px;
    }
    .detail-view button:hover {
      background: #f5d77b;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    }
    .detail-view button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .detail-view .back-link {
      display: inline-block;
      margin-top: 2rem;
      color: #d4af37;
      text-decoration: none;
      font-weight: 300;
      border-bottom: 1px solid transparent;
      transition: 0.2s;
    }
    .detail-view .back-link:hover {
      border-bottom-color: #d4af37;
    }
    /* ---------- LOGIN FORM ---------- */
    .login-form {
      max-width: 440px;
      margin: 4rem auto;
      background: #12121a;
      padding: 2.8rem;
      border-radius: 20px;
      border: 1px solid #2a2a3a;
    }
    .login-form h2 {
      font-family: 'Playfair Display', serif;
      text-align: center;
      color: #d4af37;
      font-size: 2rem;
      margin-bottom: 2rem;
    }
    .login-form input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      margin-bottom: 1.2rem;
      background: #1a1a26;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      transition: 0.3s;
    }
    .login-form input:focus {
      outline: none;
      border-color: #d4af37;
    }
    .login-form button {
      width: 100%;
      padding: 0.9rem;
      background: #d4af37;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.3s;
      color: #0b0b10;
    }
    .login-form button:hover {
      background: #f5d77b;
    }
    .toggle-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #a8a09a;
    }
    .toggle-link span {
      color: #d4af37;
      cursor: pointer;
      font-weight: 600;
    }
    .login-form .error {
      color: #e74c3c;
      text-align: center;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    /* ---------- FOOTER ---------- */
    .footer {
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      text-align: center;
      padding: 2rem 0;
      color: #5a5a6a;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 640px) {
      body { padding: 0 1rem; }
      .hero h1 { font-size: 2.2rem; }
      .product-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">VaultX <span>— since 2026</span></div>
      <div class="nav-actions" id="navActions">
        <!-- dynamic -->
      </div>
    </nav>

    <!-- Main content -->
    <div id="app"></div>

    <!-- Footer -->
    <div class="footer">The Vault of Excellence</div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore-compat.js"></script>

  <script>
    // ---------- Firebase config (your actual keys) ----------
    const firebaseConfig = {
      apiKey: "AIzaSyBBmh19VEndcv1pV40M-V3Tcov1EeKodT0",
      authDomain: "domain-store-8f13e.firebaseapp.com",
      projectId: "domain-store-8f13e",
      storageBucket: "domain-store-8f13e.firebasestorage.app",
      messagingSenderId: "237833593498",
      appId: "1:237833593498:web:8e58f6c38c53def132f523",
      measurementId: "G-5ZXEBH13WW"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ---------- State ----------
    let currentUser = null;
    let currentView = 'home'; // home | detail | login
    let selectedProduct = null;
    let allProducts = [];

    const appEl = document.getElementById('app');
    const navActions = document.getElementById('navActions');

    // ---------- Auth listener ----------
    auth.onAuthStateChanged(user => {
      currentUser = user;
      renderNav();
      if (!user && currentView !== 'login') {
        currentView = 'home';
        renderPage();
      } else if (user && currentView === 'login') {
        currentView = 'home';
        renderPage();
      } else {
        renderPage();
      }
    });

    function renderNav() {
      if (currentUser) {
        navActions.innerHTML = `
          <span class="user-email">${currentUser.email}</span>
          <button onclick="logout()">Logout</button>
        `;
      } else {
        navActions.innerHTML = `<a href="#" onclick="showLogin()">Login</a>`;
      }
    }

    // ---------- Page render ----------
    function renderPage() {
      if (currentView === 'login') renderLogin();
      else if (currentView === 'detail' && selectedProduct) renderDetail();
      else renderHome();
    }

    // ---------- Home ----------
    async function renderHome() {
      appEl.innerHTML = `
        <div class="hero">
          <h1>Where <span class="gold">Excellence</span> Meets Security</h1>
          <p>Curated luxury items, protected by escrow. Every transaction is a masterpiece.</p>
        </div>
        <div class="product-grid" id="productGrid"></div>
      `;
      const grid = document.getElementById('productGrid');
      try {
        const res = await fetch('/api/products');
        if (!res.ok) throw new Error('Network error');
        allProducts = await res.json();
        if (!allProducts.length) throw new Error('No products');
        grid.innerHTML = allProducts.map(p => `
          <div class="product-card" onclick="showDetail('${p.id}')">
            <img src="${p.image || 'https://via.placeholder.com/400x220/1a1a2e/d4af37?text=Luxury+Item'}" alt="${p.title}" />
            <div class="info">
              <h3>${p.title}</h3>
              <div class="description">${p.description}</div>
              <div class="price">$${(p.price / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
              <div class="seller">${p.sellerEmail}</div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = `<p style="color:#e74c3c; text-align:center; padding:2rem;">Failed to load products. Please ensure the backend is running.</p>`;
      }
    }

    // ---------- Detail ----------
    function showDetail(productId) {
      const p = allProducts.find(prod => prod.id === productId);
      if (!p) return alert('Product not found');
      selectedProduct = p;
      currentView = 'detail';
      renderPage();
    }

    function renderDetail() {
      const p = selectedProduct;
      appEl.innerHTML = `
        <div class="detail-view">
          <img src="${p.image || 'https://via.placeholder.com/700x400/1a1a2e/d4af37?text=Luxury+Item'}" alt="${p.title}" />
          <h1>${p.title}</h1>
          <div class="price">$${(p.price / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
          <div class="desc">${p.description}</div>
          <div class="seller">Seller: ${p.sellerEmail}</div>
          <button id="buyBtn" ${!currentUser ? 'disabled' : ''}>${currentUser ? 'Acquire Now' : 'Login to Purchase'}</button>
          <div class="message" id="detailMessage" style="color:#e74c3c; margin-top:0.5rem;"></div>
          <a href="#" class="back-link" onclick="currentView='home'; renderPage();">← Return to Collection</a>
        </div>
      `;
      document.getElementById('buyBtn')?.addEventListener('click', handleBuy);
    }

    // ---------- Buy ----------
    async function handleBuy() {
      if (!currentUser) { showLogin(); return; }
      const p = selectedProduct;
      const btn = document.getElementById('buyBtn');
      const msg = document.getElementById('detailMessage');
      btn.disabled = true;
      msg.textContent = 'Processing…';
      try {
        const res = await fetch('/api/escrow/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productId: p.id,
            buyerId: currentUser.uid,
            buyerEmail: currentUser.email,
            sellerId: p.sellerId,
            sellerEmail: p.sellerEmail,
            amount: p.price,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        window.location.href = data.checkoutUrl;
      } catch (err) {
        msg.textContent = err.message;
        btn.disabled = false;
      }
    }

    // ---------- Login ----------
    function showLogin() {
      currentView = 'login';
      renderPage();
    }

    function renderLogin() {
      appEl.innerHTML = `
        <div class="login-form">
          <h2 id="loginTitle">Welcome Back</h2>
          <input type="email" id="email" placeholder="Email" required />
          <input type="password" id="password" placeholder="Password" required />
          <button id="submitBtn">Login</button>
          <div class="toggle-link">
            <span id="toggleText">Don't have an account? <span id="toggleLink">Sign Up</span></span>
          </div>
          <div class="error" id="loginMessage"></div>
        </div>
      `;
      let isSignUp = false;
      const title = document.getElementById('loginTitle');
      const submitBtn = document.getElementById('submitBtn');
      const toggleLink = document.getElementById('toggleLink');
      const message = document.getElementById('loginMessage');

      const updateForm = () => {
        title.textContent = isSignUp ? 'Create Account' : 'Welcome Back';
        submitBtn.textContent = isSignUp ? 'Sign Up' : 'Login';
        document.getElementById('toggleText').innerHTML = isSignUp
          ? 'Already a member? <span id="toggleLink">Login</span>'
          : "New here? <span id='toggleLink'>Create Account</span>";
        document.getElementById('toggleLink').addEventListener('click', () => {
          isSignUp = !isSignUp;
          updateForm();
        });
      };
      updateForm();

      submitBtn.addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        message.textContent = '';
        try {
          if (isSignUp) await auth.createUserWithEmailAndPassword(email, password);
          else await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
          message.textContent = err.message;
        }
      });
    }

    function logout() {
      auth.signOut();
    }

    // ---------- Start ----------
    renderPage();
  </script>
</body>
</html>
