<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultX – Premium Marketplace</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif;
    }
    body {
      background: #0a0a0f;
      color: #e5e5e5;
      padding: 1rem;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid #2a2a3a;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: #d4af37;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .nav-actions button, .nav-actions a {
      background: #d4af37;
      color: #000;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
    }
    .nav-actions button:hover, .nav-actions a:hover {
      background: #f5d77b;
    }
    .user-email {
      color: #aaa;
      font-size: 0.9rem;
    }
    /* Product grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .product-card {
      background: #14141e;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .product-card:hover {
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
    }
    .product-card h3 {
      font-size: 1.2rem;
      color: #fff;
    }
    .product-card p {
      color: #aaa;
      font-size: 0.9rem;
      margin: 0.5rem 0;
    }
    .product-card .price {
      color: #d4af37;
      font-weight: bold;
      font-size: 1.1rem;
    }
    /* Product detail */
    .detail-view {
      background: #14141e;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 2rem;
      max-width: 600px;
      margin: 2rem auto;
    }
    .detail-view h1 {
      color: #fff;
      font-size: 2rem;
    }
    .detail-view .price {
      color: #d4af37;
      font-size: 1.8rem;
      margin: 1rem 0;
    }
    .detail-view button {
      background: #d4af37;
      color: #000;
      border: none;
      padding: 0.8rem 2rem;
      font-weight: bold;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .detail-view button:hover {
      background: #f5d77b;
    }
    .detail-view button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .message {
      margin-top: 1rem;
      color: #f87171;
    }
    /* Login form */
    .login-form {
      max-width: 400px;
      margin: 3rem auto;
      background: #14141e;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #2a2a3a;
    }
    .login-form h2 {
      color: #d4af37;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .login-form input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      background: #0a0a0f;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      color: #fff;
    }
    .login-form button {
      width: 100%;
      padding: 0.8rem;
      background: #d4af37;
      border: none;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-form button:hover {
      background: #f5d77b;
    }
    .toggle-link {
      text-align: center;
      margin-top: 1rem;
      color: #aaa;
    }
    .toggle-link span {
      color: #d4af37;
      cursor: pointer;
      font-weight: bold;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">VaultX</div>
      <div class="nav-actions" id="navActions">
        <!-- Dynamically filled -->
      </div>
    </nav>

    <!-- Page content -->
    <div id="app">
      <!-- Will be rendered by JS -->
    </div>
  </div>

  <!-- Firebase SDKs (client) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore-compat.js"></script>

  <script>
    // ---------- Firebase client config ----------
    const firebaseConfig = {
      apiKey: "{{NEXT_PUBLIC_FIREBASE_API_KEY}}",
      authDomain: "{{NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}}",
      projectId: "{{NEXT_PUBLIC_FIREBASE_PROJECT_ID}}",
      storageBucket: "{{NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}}",
      messagingSenderId: "{{NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}}",
      appId: "{{NEXT_PUBLIC_FIREBASE_APP_ID}}"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ---------- State ----------
    let currentUser = null;
    let currentView = 'home'; // 'home', 'detail', 'login'
    let selectedProduct = null;

    // ---------- DOM references ----------
    const appEl = document.getElementById('app');
    const navActions = document.getElementById('navActions');

    // ---------- Auth state listener ----------
    auth.onAuthStateChanged(user => {
      currentUser = user;
      renderNav();
      // If user logs out, go home
      if (!user && currentView !== 'login') {
        currentView = 'home';
        renderPage();
      } else if (user && currentView === 'login') {
        currentView = 'home';
        renderPage();
      } else {
        renderPage();
      }
    });

    // ---------- Navigation ----------
    function renderNav() {
      if (currentUser) {
        navActions.innerHTML = `
          <span class="user-email">${currentUser.email}</span>
          <button onclick="logout()">Logout</button>
        `;
      } else {
        navActions.innerHTML = `
          <a href="#" onclick="showLogin()">Login / Sign Up</a>
        `;
      }
    }

    // ---------- Page rendering ----------
    function renderPage() {
      if (currentView === 'login') {
        renderLogin();
      } else if (currentView === 'detail' && selectedProduct) {
        renderDetail();
      } else {
        renderHome();
      }
    }

    // ---------- Home (product list) ----------
    async function renderHome() {
      appEl.innerHTML = `<h1 style="color:#d4af37; margin-top:1rem;">Discover Premium Listings</h1><div class="product-grid" id="productGrid"></div>`;
      const grid = document.getElementById('productGrid');
      try {
        const res = await fetch('/api/products');
        const products = await res.json();
        grid.innerHTML = products.map(p => `
          <div class="product-card" onclick="showDetail('${p.id}')">
            <h3>${p.title}</h3>
            <p>${p.description}</p>
            <div class="price">$${(p.price / 100).toFixed(2)}</div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = '<p>Failed to load products.</p>';
      }
    }

    // ---------- Product detail ----------
    async function showDetail(productId) {
      // Fetch product from server (or we could use cached, but we'll just fetch again)
      const res = await fetch('/api/products');
      const products = await res.json();
      selectedProduct = products.find(p => p.id === productId);
      if (!selectedProduct) {
        alert('Product not found');
        return;
      }
      currentView = 'detail';
      renderPage();
    }

    function renderDetail() {
      const p = selectedProduct;
      if (!p) return;
      appEl.innerHTML = `
        <div class="detail-view">
          <h1>${p.title}</h1>
          <p style="color:#ccc;">${p.description}</p>
          <div class="price">$${(p.price / 100).toFixed(2)}</div>
          <p style="color:#888; font-size:0.9rem;">Seller: ${p.sellerEmail}</p>
          <button id="buyBtn" ${!currentUser ? 'disabled' : ''}>${currentUser ? 'Buy Now' : 'Login to Buy'}</button>
          <div class="message" id="detailMessage"></div>
          <p style="margin-top:1rem;"><a href="#" onclick="currentView='home'; renderPage();" style="color:#d4af37;">← Back to listings</a></p>
        </div>
      `;
      document.getElementById('buyBtn')?.addEventListener('click', handleBuy);
    }

    // ---------- Buy handler ----------
    async function handleBuy() {
      if (!currentUser) {
        showLogin();
        return;
      }
      const p = selectedProduct;
      const btn = document.getElementById('buyBtn');
      const msg = document.getElementById('detailMessage');
      btn.disabled = true;
      msg.textContent = 'Processing...';
      try {
        const response = await fetch('/api/escrow/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productId: p.id,
            buyerId: currentUser.uid,
            buyerEmail: currentUser.email,
            sellerId: p.sellerId,
            sellerEmail: p.sellerEmail,
            amount: p.price,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Failed');
        // Redirect to Escrow checkout
        window.location.href = data.checkoutUrl;
      } catch (err) {
        msg.textContent = err.message;
        btn.disabled = false;
      }
    }

    // ---------- Login / Sign Up ----------
    function showLogin() {
      currentView = 'login';
      renderPage();
    }

    function renderLogin() {
      appEl.innerHTML = `
        <div class="login-form">
          <h2 id="loginTitle">Welcome Back</h2>
          <input type="email" id="email" placeholder="Email" required />
          <input type="password" id="password" placeholder="Password" required />
          <button id="submitBtn">Login</button>
          <div class="toggle-link">
            <span id="toggleText">Don't have an account? <span id="toggleLink">Sign Up</span></span>
          </div>
          <div id="loginMessage" style="color:#f87171; margin-top:0.5rem;"></div>
        </div>
      `;

      let isSignUp = false;
      const title = document.getElementById('loginTitle');
      const submitBtn = document.getElementById('submitBtn');
      const toggleLink = document.getElementById('toggleLink');
      const message = document.getElementById('loginMessage');

      const updateForm = () => {
        title.textContent = isSignUp ? 'Create Account' : 'Welcome Back';
        submitBtn.textContent = isSignUp ? 'Sign Up' : 'Login';
        toggleLink.textContent = isSignUp ? 'Login' : 'Sign Up';
        document.getElementById('toggleText').innerHTML = isSignUp
          ? 'Already have an account? <span id="toggleLink">Login</span>'
          : "Don't have an account? <span id='toggleLink'>Sign Up</span>";
        // Re-bind toggle
        document.getElementById('toggleLink').addEventListener('click', () => {
          isSignUp = !isSignUp;
          updateForm();
        });
      };
      updateForm();

      submitBtn.addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        message.textContent = '';
        try {
          if (isSignUp) {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
          // On success, auth listener will redirect
        } catch (err) {
          message.textContent = err.message;
        }
      });
    }

    // ---------- Logout ----------
    function logout() {
      auth.signOut();
    }

    // ---------- Initial render ----------
    renderPage();
  </script>
</body>
</html>
